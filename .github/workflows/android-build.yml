name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug -Px.enableFlipLearning=false

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "localmind-${{ steps.version.outputs.version }}-debug.apk"
          ls -lh localmind-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: localmind-${{ steps.version.outputs.version }}-debug
          path: localmind-${{ steps.version.outputs.version }}-debug.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "LocalMind $TAG" \
              --notes "Automated build of LocalMind $TAG ($GITHUB_SHA)" \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "localmind-$VERSION-debug.apk" --clobber
